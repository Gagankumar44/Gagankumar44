<svg xmlns="http://www.w3.org/2000/svg" width="600" height="570" viewBox="0 0 600 570" role="img" aria-labelledby="title desc">
<title id="title">Gagan Kumar — Developer control room</title><desc id="desc">Creative builder exploring design, code and AI. A conceptual idea network animates beside the profile identity.</desc>
