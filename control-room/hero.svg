  <text x="36" y="104" fill="#9bb1c3" font-size="15" class="mono" >CREATIVE BUILDER</text>
  <text x="30" y="191" fill="#eef6fc" font-size="75" font-weight="800" letter-spacing="-2">GAGAN KUMAR</text>
  <text x="35" y="237" fill="#52e0ef" font-size="27" >Ideas become experiments.</text>
  <text x="35" y="273" fill="#eef6fc" font-size="25" >Experiments become understanding.</text>
  <text x="36" y="326" fill="#b7f76b" font-size="17" class="mono" >&gt; design. build. learn.</text><rect class="cursor" x="275" y="312" width="9" height="17" fill="#b7f76b"/>
  <circle cx="815" cy="212" r="160" fill="url(#glow)"/>
  <g fill="none" stroke="#243849"><circle cx="815" cy="212" r="112"/><circle cx="815" cy="212" r="80.64"/><circle cx="815" cy="212" r="43.68"/><path d="M688 212H942M815 85V339" stroke-dasharray="3 7"/></g>
  <g class="spin"><circle cx="815" cy="212" r="112" fill="none" stroke="#52e0ef" stroke-width="2" stroke-dasharray="44 659.696"/><circle cx="927" cy="212" r="4" fill="#52e0ef" /></g>
  <path d="M729.88 250.08L772.44 158.24L871 182.88L859.8 273.6L729.88 250.08L815 212L871 182.88" fill="none" stroke="#315d70" stroke-width="1.4"/>
