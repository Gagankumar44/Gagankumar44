<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 5s linear infinite}.draw{stroke-dasharray:600;animation:draw 5s ease-in-out infinite}.cursor{animation:cursor 2.4s steps(1,end) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes draw{0%,12%{stroke-dashoffset:600}65%,100%{stroke-dashoffset:0}}@keyframes cursor{0%,55%{opacity:1}56%,100%{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
